# Instellingen van de website
title: Mijn keuken
description: Eenvoudige dagelijkse gerechten. Basic, geen gedoe.
lang: nl
baseurl: "/Gerechten"

# Elk bestand in de map _recepten wordt een eigen pagina
collections:
  recepten:
    output: true
    permalink: /recepten/:name/

defaults:
  - scope:
      path: ""
      type: recepten
    values:
      layout: recept
